name: Bug report
description: Report a reproducible problem with the plugin.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not post passwords, API keys, cookies, recipient lists, or production databases.
        Suspected vulnerabilities belong in the channel described in SECURITY.md, not this public form.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version or commit
      placeholder: "12.1.2 or the full commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include WordPress/PHP versions, GD and Imagick availability, and the browser or email client. Remove sensitive details.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a minimal timer with synthetic data. Include the endpoint mode and HTTP status when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include redacted screenshots or logs only when useful.
    validations:
      required: true
