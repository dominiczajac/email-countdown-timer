name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        backend: ['imagick']
        include:
          - php: '8.4'
            backend: gd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: "${{ matrix.backend == 'gd' && 'gd, :imagick' || 'gd, imagick' }}"
          coverage: none
          tools: none
      - name: Plugin Check gate negative tests
        run: python3 tests/test-pcp-gate.py
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Security and rendering regression tests
        env:
          ECD_REQUIRE_GD: '1'
          ECD_REQUIRE_IMAGICK: ${{ matrix.backend == 'imagick' && '1' || '0' }}
        run: php tests/run.php
      - name: Uninstall safety regression tests
        run: php tests/uninstall.php
      - name: JavaScript syntax
        run: node --check assets/countdown.js && node --check assets/admin.js
  plugin-check:
    uses: ./.github/workflows/plugin-check.yml
  wordpress:
    uses: ./.github/workflows/wordpress.yml
  # Fail closed on failed, skipped or cancelled unit/integration jobs.
  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs: [test, wordpress, plugin-check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require unit and real WordPress matrices to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PCP_RESULT: ${{ needs.plugin-check.result }}
          WORDPRESS_RESULT: ${{ needs.wordpress.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$WORDPRESS_RESULT" = success
          test "$PCP_RESULT" = success
