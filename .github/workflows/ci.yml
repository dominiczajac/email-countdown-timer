name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        backend: ['imagick']
        include:
          - php: '8.4'
            backend: gd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: "${{ matrix.backend == 'gd' && 'gd, :imagick' || 'gd, imagick' }}"
          coverage: none
          tools: none
      - name: Plugin Check gate negative tests
        run: python3 tests/test-pcp-gate.py
      - name: Distribution build negative tests and privacy guide
        run: |
          python3 tests/test-build.py
          php tests/privacy-policy.php
          php tests/privacy-policy.php missing
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Security and rendering regression tests
        env:
          ECD_REQUIRE_GD: '1'
          ECD_REQUIRE_IMAGICK: ${{ matrix.backend == 'imagick' && '1' || '0' }}
        run: php tests/run.php
      - name: Reconciled alt, privacy and image-only cache contracts
        run: |
          php tests/alt-run.php
          php tests/cache-bootstrap.php normal
          php tests/cache-bootstrap.php image
          php tests/cache-bootstrap.php array
          python3 tests/privacy-contracts.py
          node tests/countdown.test.cjs
      - name: Persistent fonts and layout preflight
        run: php tests/font-storage.php
      - name: Lock outcome and current static fallback
        run: php tests/lock-outcomes.php
      - name: Font access and approved maintenance contracts
        run: |
          php tests/font-access.php
          php tests/maintenance.php
      - name: Local end-image and branding regression tests
        run: php tests/end-image.php
      - name: Uninstall safety regression tests
        run: php tests/uninstall.php
      - name: Privacy-sensitive API guardrail
        run: php tests/privacy-audit.php
      - name: Optimizer timing simulation
        run: node tests/frontend-compat.js
      - name: JavaScript syntax
        run: node --check assets/countdown.js && node --check assets/admin.js && node --check assets/end-image.js
  font-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test servers
        run: sudo apt-get update -qq && sudo apt-get install -y apache2 nginx php-cli
      - name: Isolated Apache and nginx font access tests
        run: sudo python3 tests/font-http.py --report "$RUNNER_TEMP/font-http.json"
      - name: Preserve font HTTP evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: font-http-evidence
          path: ${{ runner.temp }}/font-http.json
          retention-days: 14
          if-no-files-found: error
  plugin-check:
    uses: ./.github/workflows/plugin-check.yml
  wordpress:
    uses: ./.github/workflows/wordpress.yml
  # Fail closed on failed, skipped or cancelled unit/integration jobs.
  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs: [test, wordpress, plugin-check, font-http]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require unit and real WordPress matrices to pass
        env:
          FONT_HTTP_RESULT: ${{ needs.font-http.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PCP_RESULT: ${{ needs.plugin-check.result }}
          WORDPRESS_RESULT: ${{ needs.wordpress.result }}
        run: |
          test "$FONT_HTTP_RESULT" = success
          test "$TEST_RESULT" = success
          test "$WORDPRESS_RESULT" = success
          test "$PCP_RESULT" = success
