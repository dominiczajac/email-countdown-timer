name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        backend: ['imagick']
        include:
          - php: '8.4'
            backend: gd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: "${{ matrix.backend == 'gd' && 'gd, :imagick' || 'gd, imagick' }}"
          coverage: none
          tools: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Security and rendering regression tests
        env:
          ECD_REQUIRE_GD: '1'
          ECD_REQUIRE_IMAGICK: ${{ matrix.backend == 'imagick' && '1' || '0' }}
        run: php tests/run.php
      - name: JavaScript syntax
        run: node --check assets/countdown.js
  # Keep one stable required check even when the test matrix changes.
  # Skipped, cancelled, or failed matrix jobs must not satisfy this gate.
  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the complete test matrix to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "The test matrix did not pass: $TEST_RESULT"
            exit 1
          fi
