name: Multisite theme profiles
on:
  pull_request:
    paths:
      - '.github/workflows/multisite-themes.yml'
      - 'tests/multisite/**'
      - 'tests/browser/wordpress.py'
      - 'tests/cache-profiles/contracts.py'
      - 'tests/cache-profiles/server_contracts.py'
      - 'tests/gutenberg/check-native-logs.py'
      - 'tests/litespeed/native_logs.py'
      - 'docs/MULTISITE-THEME-COMPATIBILITY.md'
      - 'docs/MULTISITE-SUPER-CACHE.md'
      - 'includes/**'
      - 'assets/**'
      - 'blocks/**'
      - 'email-countdown-timer.php'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: network-themes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, wp-super-cache]
        theme: [twentytwentyone, twentytwentyfour]
        activation: [site, network]
        jit: ['1235', 'disable']
    services:
      mysql:
        image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: network-disposable-only
          MYSQL_DATABASE: ecd_network
          MYSQL_ROOT_HOST: '%'
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pnetwork-disposable-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: mysqli, gd, imagick, curl, mbstring, xml, zip
          tools: wp-cli:2.12.0
          coverage: none
          ini-values: opcache.enable=1, opcache.jit=${{ matrix.jit }}, opcache.jit_buffer_size=256M
      - name: Native server and browser dependencies
        run: |
          test "$(wp cli version)" = 'WP-CLI 2.12.0'
          # Verify the runner nginx and the FPM build already supplied by setup-php.
          nginx -v
          /usr/sbin/php-fpm8.4 -v
          python3 -m venv "$RUNNER_TEMP/network-venv"
          "$RUNNER_TEMP/network-venv/bin/pip" install playwright==1.57.0 Pillow==12.1.0
      - name: Three-site activation and theme experiment
        env:
          ECD_INTEGRATION_DISPOSABLE: '1'
          ECD_NETWORK_PROFILE: ${{ matrix.profile }}
          ECD_NETWORK_THEME: ${{ matrix.theme }}
          ECD_NETWORK_ACTIVATION: ${{ matrix.activation }}
          ECD_NETWORK_JIT: ${{ matrix.jit }}
        run: bash tests/multisite/run.sh
      - name: Retain positive and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: network-${{ matrix.profile }}-${{ matrix.theme }}-${{ matrix.activation }}-jit-${{ matrix.jit }}
          path: ${{ runner.temp }}/network-evidence/
          if-no-files-found: error
          retention-days: 14
