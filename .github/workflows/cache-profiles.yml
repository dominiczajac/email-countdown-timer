name: Isolated plugin profiles
on:
  pull_request:
    paths:
      - '.github/workflows/cache-profiles.yml'
      - 'tests/cache-profiles/**'
      - 'docs/ISOLATED-CACHE-PROFILES.md'
      - 'docs/ISOLATED-BUILDER-COMMERCE.md'
      - 'includes/**'
      - 'assets/**'
      - 'blocks/**'
      - 'email-countdown-timer.php'
      - 'scripts/distribution-files.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cache-profiles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, wp-super-cache, w3-total-cache, autoptimize, elementor, woocommerce]
        jit: ['1235', 'disable']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: cache-lab-disposable-only
          MYSQL_DATABASE: ect_cache_lab
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pcache-lab-disposable-only"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mysqli, gd, imagick, curl, mbstring, xml, zip
          tools: wp-cli:2.12.0
          coverage: none
          ini-values: opcache.enable=1, opcache.jit=${{ matrix.jit }}, opcache.jit_buffer_size=256M
      - name: Native server and isolated test dependencies
        run: |
          test "$(wp cli version)" = 'WP-CLI 2.12.0'
          # Verify the runner nginx and the FPM build already supplied by setup-php.
          nginx -v
          /usr/sbin/php-fpm8.4 -v
          python3 -m venv "$RUNNER_TEMP/cache-venv"
          "$RUNNER_TEMP/cache-venv/bin/pip" install playwright==1.57.0 Pillow==12.1.0
      - name: Paired isolated cache experiment
        env:
          ECD_INTEGRATION_DISPOSABLE: '1'
          ECD_CACHE_PROFILE: ${{ matrix.profile }}
          ECD_CACHE_JIT: ${{ matrix.jit }}
        run: bash tests/cache-profiles/run.sh
      - name: Retain positive and negative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cache-${{ matrix.profile }}-jit-${{ matrix.jit }}
          path: ${{ runner.temp }}/cache-evidence/
          if-no-files-found: error
          retention-days: 14
