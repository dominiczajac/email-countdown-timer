name: Apply authorized example-font packaging once
on:
  push:
    branches: [feat/bundled-example-font]
    paths: [.github/apply-font-packaging.py]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'dominiczajac/email-countdown-timer' && github.ref == 'refs/heads/feat/bundled-example-font'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Apply reviewed text changes and preserve upstream font bytes
        run: |
          python3 .github/apply-font-packaging.py
          python3 tests/test-build.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: package one optional local OFL font with provenance and regressions'
          git push origin HEAD:refs/heads/feat/bundled-example-font
