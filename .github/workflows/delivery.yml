name: Layout and native email delivery
on:
  workflow_call:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: delivery-disposable-only
          MYSQL_DATABASE: ect_delivery
        ports: ['3307:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pdelivery-disposable-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mysqli, gd, imagick
          tools: wp-cli
          coverage: none
      - name: Install isolated rendering tools and verified Thunderbird archive
        run: |
          mkdir -p "$RUNNER_TEMP/delivery-evidence" "$RUNNER_TEMP/native-mail"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb scrot libgtk-3-0t64 libasound2t64 libdbus-glib-1-2
          python3 -m venv "$RUNNER_TEMP/delivery-venv"
          "$RUNNER_TEMP/delivery-venv/bin/pip" install playwright==1.57.0 Pillow==11.3.0
          cd "$RUNNER_TEMP/native-mail"
          curl --fail --location --retry 2 'https://archive.mozilla.org/pub/thunderbird/releases/156.0.1/SHA256SUMS' -o SHA256SUMS
          curl --fail --location --retry 2 'https://archive.mozilla.org/pub/thunderbird/releases/156.0.1/linux-x86_64/en-US/thunderbird-156.0.1.tar.xz' -o thunderbird.tar.xz
          python3 - <<'PY'
          import hashlib,pathlib
          lines=pathlib.Path('SHA256SUMS').read_text().splitlines()
          matches=[x.split()[0] for x in lines if x.split()[-1]=='linux-x86_64/en-US/thunderbird-156.0.1.tar.xz']
          assert len(matches)==1 and hashlib.sha256(pathlib.Path('thunderbird.tar.xz').read_bytes()).hexdigest()==matches[0]
          PY
          sha256sum thunderbird.tar.xz > "$RUNNER_TEMP/delivery-evidence/thunderbird-sha256.txt"
          tar -xJf thunderbird.tar.xz
          mkdir -p thunderbird/distribution
          printf '%s\n' '{"policies":{"DisableAppUpdate":true,"DisableTelemetry":true}}' > thunderbird/distribution/policies.json
          echo "ECD_THUNDERBIRD=$RUNNER_TEMP/native-mail/thunderbird/thunderbird" >> "$GITHUB_ENV"
      - name: Native geometry, measured layout and real local-message rendering
        env:
          ECD_INTEGRATION_DISPOSABLE: '1'
        run: bash tests/delivery/run.sh
      - name: Preserve all results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-evidence
          path: ${{ runner.temp }}/delivery-evidence/
          retention-days: 14
          if-no-files-found: error
